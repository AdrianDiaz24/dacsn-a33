services:
  tienda: 
    image: prestashop/prestashop:8.2
    enviorements:
      PS_DEMO_MODE: 0
      PS_INSTALL_AUTO: 1
      PS_LANGUAGE: es
      PS_COUNTRY: ES
      PS_FOLDER_ADMIN: admin-tienda
      PS_FOLDER_INSTALL: install-tienda
      PS_DOMAIN: ${DIRECCION}:${PUERTO}


    volume:
      - ficherosTiendas:/var/www/html
    networks:
    ports: "${PUERTO:-8080}:80"
    depends_on:
      - bd:
        condition: service_healthy
    restart: unless-stopped
  
  bd:
    image: 
    enviorements:
      - PS_DEMO_MODE=0 
    volume:
    networks:
    ports:
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
    restart: 

  correo:


volumes:
  ficherosTienda

networks:
  interna:
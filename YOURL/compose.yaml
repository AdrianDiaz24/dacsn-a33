services:
  web:
    image: nginx:1.30
    restart: unless-stopped
    ports:
      - "${PUERTO:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - codigo:/var/www/html:ro
    networks:
      - frontal
    depends_on:
      yourls:
        condition: service_started

  yourls:
    image: yourls:1.10.6-fpm
    restart: unless-stopped
    volumes:
      - codigo:/var/www/html
    networks:
      - frontal
      - interna
    depends_on:
      bd:
        condition: service_healthy
    environment:
      YOURLS_SITE: http://${DIRECCION:?falta en el fichero .env}:${PUERTO:-8080}
      YOURLS_USER: ${YOURLS_USUARIO:-admin}
      YOURLS_PASS: ${YOURLS_CONTRASENA:?falta en el fichero .env}
      YOURLS_DB_HOST: bd
      YOURLS_DB_NAME: ${BD_NOMBRE:-yourls}
      YOURLS_DB_USER: ${BD_USUARIO:-yourls}
      YOURLS_DB_PASS: ${BD_CONTRASENA:?falta en el fichero .env}

  bd:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${BD_NOMBRE:-yourls}
      MARIADB_USER: ${BD_USUARIO:-yourls}
      MARIADB_PASSWORD: ${BD_CONTRASENA:?falta en el fichero .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - bd-datos:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  codigo:
  bd-datos:

networks:
  frontal:
  interna:
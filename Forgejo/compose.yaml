services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped
    ports:
      - "${PUERTO:-3000}:3000"
      - "${PUERTO_SSH:-2222}:22"
    volumes:
      - forgejo-datos:/data
    networks:
      - interna
    depends_on:
      bd:
        condition: service_healthy
      cache:
        condition: service_healthy
      correo:
        condition: service_started
    environment:
      USER_UID: "1000"
      USER_GID: "1000"

      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: bd:5432
      FORGEJO__database__NAME: ${BD_NOMBRE:-forgejo}
      FORGEJO__database__USER: ${BD_USUARIO:-forgejo}
      FORGEJO__database__PASSWD: ${BD_CONTRASENA:?falta en el fichero .env}

      FORGEJO__server__DOMAIN: ${DIRECCION:?falta en el fichero .env}
      FORGEJO__server__ROOT_URL: http://${DIRECCION:?falta en el fichero .env}:${PUERTO:-3000}/
      FORGEJO__server__SSH_PORT: ${PUERTO_SSH:-2222}
      FORGEJO__server__SSH_LISTEN_PORT: "22"

      FORGEJO__security__INSTALL_LOCK: "true"

      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: correo
      FORGEJO__mailer__SMTP_PORT: "1025"
      FORGEJO__mailer__FROM: forgejo@dacsn.local

      FORGEJO__cache__ADAPTER: redis
      FORGEJO__cache__HOST: redis://:${REDIS_CONTRASENA:?falta en el fichero .env}@cache:6379/0
      FORGEJO__session__PROVIDER: redis
      FORGEJO__session__PROVIDER_CONFIG: redis://:${REDIS_CONTRASENA:?falta en el fichero .env}@cache:6379/0
      FORGEJO__queue__TYPE: redis
      FORGEJO__queue__CONN_STR: redis://:${REDIS_CONTRASENA:?falta en el fichero .env}@cache:6379/0

  bd:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BD_NOMBRE:-forgejo}
      POSTGRES_USER: ${BD_USUARIO:-forgejo}
      POSTGRES_PASSWORD: ${BD_CONTRASENA:?falta en el fichero .env}
    volumes:
      - bd-datos:/var/lib/postgresql
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  cache:
    image: redis:7.2
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_CONTRASENA:?falta en el fichero .env}
    volumes:
      - cache-datos:/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  correo:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${PUERTO_CORREO:-8025}:8025"
    networks:
      - interna

volumes:
  forgejo-datos:
  bd-datos:
  cache-datos:

networks:
  interna: